name: Update currency prices

on:
  schedule:
    # GitHub's cron scheduler is busiest (and most likely to silently drop a run)
    # in the first few minutes of every hour, since that's when the vast majority
    # of scheduled workflows across all of GitHub also fire. Running at :37 instead
    # of :05 avoids that peak — still best-effort (GitHub Actions schedules are
    # never guaranteed to fire exactly on time, or at all, under high load), but
    # meaningfully more reliable.
    - cron: "37 * * * *" # every hour, at :37
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch poe.ninja prices and upsert into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POE_LEAGUE: ${{ vars.POE_LEAGUE }}
        run: |
          chmod +x scripts/fetch-prices.sh
          ./scripts/fetch-prices.sh
