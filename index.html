<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guild Stash Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <div class="login-title">GUILD STASH</div>
      <div class="login-sub">Path of Exile 2 &middot; 0.5.5</div>
      <div class="member-grid" id="member-grid"></div>
      <input id="pin-input" class="pin-input hidden" type="password" inputmode="numeric" maxlength="6" placeholder="••••" />
      <div class="error-text" id="login-error"></div>
      <button id="login-btn" class="btn hidden">Enter</button>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <div class="sidebar">
      <div class="sidebar-title">GUILD STASH</div>
      <div class="nav-link" data-page="overview">Overview</div>
      <div class="nav-link" data-page="ledger">Ledger</div>
      <div class="nav-link" data-page="investments">Investments</div>
      <div class="nav-link" data-page="splits">Splits</div>
      <div class="nav-link" data-page="myvalue">My Value</div>
      <div class="sidebar-footer">
        <div class="who">Logged in as <b id="who-name"></b></div>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Log out</button>
      </div>
    </div>
    <main id="main-content"></main>
  </div>

  <div id="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
